name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Includes a production build check in a temp folder (tests/build.test.ts).
      - run: npm test
      # GitHub Pages serves the site under /<repo>/.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/

  deploy:
    # Continuous deployment: only after the checks pass on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    # Tags and publishes a GitHub release when package.json carries a version that has none yet.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v already released"
            exit 0
          fi
          section() { awk -v v="$2" '/^## /{p=($2==v)} p&&!/^## /' "$1" | sed '/./,$!d'; }
          { echo "## Français"; echo; section CHANGELOG.md "$v"; echo; echo "## English"; echo; section CHANGELOG.en.md "$v"; } > notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "BreakBreaker $v" --notes-file notes.md --latest
