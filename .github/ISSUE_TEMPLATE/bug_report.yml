name: Bug report
description: Something is broken or looks wrong in the game
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start a game\n2. Reach round 4\n3. ..."
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown in the footer of the landing page.
      placeholder: "1.0.1"
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "iPhone 14, Safari / Windows, Chrome 130"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
