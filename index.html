<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>BreakBreaker - Défends le quartier</title>
    <meta
      name="description"
      content="Jeu d'action arcade en pixel art, vu du dessus. Incarne Paul, défends le quartier, aide les passants et renvoie les projectiles."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#14121c" />
    <link rel="stylesheet" href="/src/site/landing.css" />
  </head>
  <body>
    <!-- Decorative hero: pixel-art street scene composed from the game's own tiles and sprites (npm run hero). No photograph, no flags. -->
    <div class="hero-art" aria-hidden="true">
      <span class="fire-glow"></span>
      <span class="ember e1"></span>
      <span class="ember e2"></span>
      <span class="ember e3"></span>
      <span class="ember e4"></span>
      <span class="ember e5"></span>
      <span class="ember e6"></span>
    </div>

    <main class="stage">
      <h1 class="title">BreakBreaker</h1>
      <p class="tagline">Défends le quartier. Tiens aussi longtemps que possible.</p>
      <p class="cta">
        <a class="btn btn-primary" href="jouer/?go">Jouer</a>
        <button class="btn btn-secondary btn-commandes" type="button" popovertarget="commandes">Commandes</button>
      </p>
    </main>

    <div id="commandes" popover role="dialog" aria-labelledby="commandes-titre">
      <h2 id="commandes-titre">Commandes</h2>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Tableau des commandes">
        <table>
          <caption class="sr-only">Commandes au clavier et sur écran tactile</caption>
          <thead>
            <tr><th scope="col">Action</th><th scope="col">Clavier et souris</th><th scope="col">Tactile</th></tr>
          </thead>
          <tbody>
            <!--controls-->
          </tbody>
        </table>
      </div>
      <button class="btn btn-primary" type="button" popovertarget="commandes" popovertargetaction="hide">Fermer</button>
    </div>

    <footer class="site-footer">
      <p>
        <span>Version <!--version--></span>
        <a href="CREDITS.md">Crédits</a>
        <a href="https://github.com/thlaure/BreakBreaker">Code source</a>
      </p>
      <p class="notice"><!--notice--></p>
    </footer>
  </body>
</html>
